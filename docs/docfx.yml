$schema: https://raw.githubusercontent.com/dotnet/docfx/main/schemas/docfx.schema.json
metadata:
  - src:
      - src: ../src
        files:
          - Grist4NET/Grist4NET.csproj
    dest: api/Grist4NET
  - src:
      - src: ../src
        files:
          - Grist4NET.Kiota/Grist4NET.Kiota.csproj
    dest: api/Grist4NET.Kiota
build:
  content:
    - files:
        - '**/*.{md,yml}'
      exclude:
        - docfx.yml
  resource:
    - files:
        - media/**
  output: ../_site
  template:
    - default
  globalMetadata:
    _appName: Grist4NET
    _appTitle: Grist4NET
    _appLogoPath: media/icon.svg
    _appFaviconPath: media/icon.png
    _appFooter: >-
      <strong>Grist</strong> is a trademark of <em>Grist Labs, Inc.</em>
      <strong>Grist4NET</strong> is not affiliated with or endorsed by <em>Grist Labs, Inc.</em>
      Generated by <strong>DocFX</strong>
    _enableSearch: true
    _disableContribution: false
    _gitContribute:
      - repo: https://codeberg.org/dj1/Grist4NET
        branch: public
    pdf: false
